[project]
name = "subway-eink"
version = "0.1.0"
description = "Raspberry Pi transit, weather and bike display for the Touch Display 2"
readme = "README.md"
requires-python = ">=3.13"
# The Touch Display 2 is driven through the kernel's DRM fbdev node and its
# touchscreen through evdev, so no GPIO, SPI or I2C libraries are needed. That
# also sidesteps RPi.GPIO, which does not support the Pi 5's RP1 south bridge.
dependencies = [
    "cairocffi>=1.7.1",
    "cairosvg>=2.7.1",
    "numpy>=2.1.3",
    "nyct-gtfs>=2.0.0",
    "pillow>=11.0.0",
    "python-dotenv>=1.0.1",
    "pytz>=2024.2",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
